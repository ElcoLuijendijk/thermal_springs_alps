name: Run notebooks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  run-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the conda environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Run all notebooks
        run: python run_all.py

      - name: Show which data files have changed
        run: git status --short data

      - name: Upload figures and data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figures-and-data
          path: |
            fig/
            data/*.csv
            executed_notebooks/
